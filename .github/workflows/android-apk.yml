name: Build Mihrab Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK platform
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Extract original Mihrab project
        run: |
          rm -rf mihrab android
          mkdir -p mihrab android/app/src/main/java/com/mihrab/app android/app/src/main/res/drawable android/app/src/main/res/mipmap-hdpi
          unzip -q grok-workspace.zip -d mihrab

      - name: Generate the original server-rendered pages
        working-directory: mihrab
        run: |
          mkdir -p ../android/app/src/main/assets/site
          cp -a .vercel/output/static/. ../android/app/src/main/assets/site/
          cat > generate-static.mjs <<'JS'
          import fs from 'node:fs/promises';
          import path from 'node:path';
          import handler from './.vercel/output/functions/__server.func/index.mjs';

          const root = path.resolve('../android/app/src/main/assets/site');
          const routes = ['/', '/about', '/adhkar', '/bookmarks', '/duas', '/more', '/names', '/prayer', '/qibla', '/quran', '/search', '/settings', '/tasbih'];

          for (const route of routes) {
            const response = await handler.fetch(new Request('https://appassets.androidplatform.net' + route, {
              headers: { accept: 'text/html' }
            }), {});
            if (!response.ok) throw new Error(route + ' returned ' + response.status);
            let html = Buffer.from(await response.arrayBuffer()).toString('utf8');
            html = html.replace(/<script src="https:\/\/grok\.com\/grok-app-builder\/extensions\.js"[^>]*><\/script>/g, '');
            const dir = path.join(root, route === '/' ? '' : route.slice(1));
            await fs.mkdir(dir, { recursive: true });
            await fs.writeFile(path.join(dir, 'index.html'), html);
          }
          await fs.writeFile(path.join(root, '404.html'), await fs.readFile(path.join(root, 'index.html')));
          JS
          node generate-static.mjs
          cp .vercel/output/static/__grok/icon-180.png ../android/app/src/main/res/drawable/icon.png

      - name: Create Android project
        run: |
          cat > android/settings.gradle <<'EOF2'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = 'Mihrab'
          include ':app'
          EOF2

          cat > android/build.gradle <<'EOF2'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF2

          cat > android/app/build.gradle <<'EOF2'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.mihrab.app'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.mihrab.app'
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
          }
          EOF2

          cat > android/app/src/main/AndroidManifest.xml <<'EOF2'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />

              <application
                  android:allowBackup="true"
                  android:label="میحراب"
                  android:icon="@drawable/icon"
                  android:roundIcon="@drawable/icon"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="unspecified"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF2

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/styles.xml <<'EOF2'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:colorAccent">#0c1210</item>
                  <item name="android:navigationBarColor">#0c1210</item>
                  <item name="android:statusBarColor">#0c1210</item>
                  <item name="android:windowLightStatusBar">false</item>
              </style>
          </resources>
          EOF2

          cat > android/app/src/main/java/com/mihrab/app/MainActivity.java <<'EOF2'
          package com.mihrab.app;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.webkit.CookieManager;
          import android.webkit.GeolocationPermissions;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          import java.io.IOException;
          import java.io.InputStream;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final String HOST = "appassets.androidplatform.net";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().setStatusBarColor(Color.rgb(12, 18, 16));
                  getWindow().setNavigationBarColor(Color.rgb(12, 18, 16));

                  webView = new WebView(this);
                  webView.setBackgroundColor(Color.rgb(12, 18, 16));
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setBuiltInZoomControls(false);
                  s.setDisplayZoomControls(false);
                  s.setSupportZoom(false);
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setMediaPlaybackRequiresUserGesture(false);
                  CookieManager.getInstance().setAcceptCookie(true);

                  webView.setWebViewClient(new LocalWebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onGeolocationPermissionsShowPrompt(String origin, GeolocationPermissions.Callback callback) {
                          if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
                                  || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED) {
                              callback.invoke(origin, true, false);
                          } else {
                              requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 42);
                              callback.invoke(origin, true, false);
                          }
                      }
                  });

                  setContentView(webView);
                  webView.loadUrl("https://" + HOST + "/index.html");

                  if (checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(new String[]{Manifest.permission.ACCESS_FINE_LOCATION, Manifest.permission.ACCESS_COARSE_LOCATION}, 42);
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }

              private static String mimeFor(String path) {
                  String p = path.toLowerCase(Locale.ROOT);
                  if (p.endsWith(".html")) return "text/html";
                  if (p.endsWith(".js") || p.endsWith(".mjs")) return "text/javascript";
                  if (p.endsWith(".css")) return "text/css";
                  if (p.endsWith(".json") || p.endsWith(".webmanifest")) return "application/json";
                  if (p.endsWith(".svg")) return "image/svg+xml";
                  if (p.endsWith(".png")) return "image/png";
                  if (p.endsWith(".jpg") || p.endsWith(".jpeg")) return "image/jpeg";
                  if (p.endsWith(".webp")) return "image/webp";
                  return "application/octet-stream";
              }

              private class LocalWebViewClient extends WebViewClient {
                  @Override
                  public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                      String scheme = request.getUrl().getScheme();
                      String host = request.getUrl().getHost();
                      if (!"https".equalsIgnoreCase(scheme) || !HOST.equalsIgnoreCase(host)) {
                          return super.shouldInterceptRequest(view, request);
                      }

                      String path = request.getUrl().getPath();
                      if (path == null || path.isEmpty() || "/".equals(path)) path = "/index.html";
                      String assetPath = path.substring(1);
                      if (!assetPath.contains(".")) assetPath = assetPath + "/index.html";

                      try {
                          InputStream stream = getAssets().open("site/" + assetPath);
                          return new WebResourceResponse(mimeFor(assetPath), "UTF-8", stream);
                      } catch (IOException ignored) {
                          try {
                              InputStream stream = getAssets().open("site/index.html");
                              return new WebResourceResponse("text/html", "UTF-8", stream);
                          } catch (IOException e) {
                              return null;
                          }
                      }
                  }
              }
          }
          EOF2

      - name: Build installable APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mihrab-Android11-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
